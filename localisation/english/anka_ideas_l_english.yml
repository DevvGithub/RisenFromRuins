l_english:
 SOZ_Remnants:0 "§RRemnants of a past§!"
 SOZ_Remnants_desc:0 "Germany, especially the eastern side. Was as a result of a brutal war, almost completely destroyed. It all now lays in ruins."
 SOZ_HJ:0 "The §RHitlerjugend§!"
 SOZ_HJ_desc:0 "After the war, the East German state despite being quickly turned communist, did not lose the previous regimes influence over its younger demographic. The §RHitlerjugend§! still remains as a part of society, something to be rooted out."
 DDR_FDJ:0 "Freie Deutsche Jugend"
 DDR_FDJ_desc:0 "The Political youth organisation "Freie Deutsche Jugend" or better known as the "Free German Youth", promoting the state agenda and teaching the German youth Communist German ideals."
 SOZ_NaOfficers:0 "Nazi Officers?"
 DDR_RF:0 "§LRepubliksflucht§!"
 DDR_RF_desc:0 "Despite the Eastern half of Germany being a beaming beacon of equality, some people are just more equal than others."
 SOZ_SovOfficers:0 "Soviet Officers"
 SOZ_SovOfficers_desc:0 "Getting rid of the past has led to a new officer corps. Being led by Soviet military officials rather than Germans."
 SOZ_GermanOfficers:0 "German Officers"
 SOZ_GermanOfficers_desc:0 "Purging the truly evil Nazi remnants, keeping those who are loyal only to Germany, rather than the state, might have some benefits."
