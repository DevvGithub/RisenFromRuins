 italy_dem.1.a:0 "An historic day"
 sov_moon.1.t:0 "Red Moon"
 sov_moon.1.d:0 "July 1969, it's a warm night in the united states and people are currently glued to the screens, today it's one of humanity's most important days.\n\nA man is landing on the moon.\n\nIt's not a movie, it's not some kind of plot by the government...a man is setting foot on the surface of another world, one thought so distant for many, now in the reach of one.\n\nPeople are pooling in public places searching for a TV, no need to change the channel, everyone's watching.\nThe anticipation grows as finally, it's confirmed, we have an image.\nPeople gasp and are shocked by the view of the lunar landscape, one of dust and void, toghether with the landscape furthermore, there's some sort of ladder, the news reporters wonder when the man is coming to come down, everyone awaits with their breath held as then a foot, then both, are visible by the camera, starting to descend from the ladder.\nThey did it, they had made it, the faces in the general crowd started to turn from awe to shock and even rage, was this really a moment to celebrate...?\n\nStatic fills the audio as finally an audio link is reached, the figure finally stepping onto the ground...marking the first man on the moon and then, his first words.\n\n"Я делаю этот шаг ради своей страны, ради своего народа и ради марксистско-ленинского образа жизни, сознавая, что сегодняшний день — лишь малый шаг на пути, который однажды приведет нас всех к звездам."\n\nNo one speaks, no one moves, the American eagle is bested by the Soviet bear...no one dares to say anything, and in the silence of that night...a red banner is planted on the lunar surface, a constant and lasting reminder of who got there first."
 sov_moon.1.a:0 "The eagle falls..."
