 italy_1.1.t:0 "The Future Of Italy"
 italy_1.1.d:0 "After surrendering to the allies in the second world war and then fighting alongside them, italy finds itself divided more than ever, some people demand the exile of the king, others want to keep him around, many plead for democracy to be estabilished. All this while the Allies look over us, awaiting what it will be, all eyes are on us. Italy might aswell be the tipping point of this new front of the current political climate, a cold war...that no one hopes turns warm."
